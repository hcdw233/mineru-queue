[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mineru-queue"
version = "0.1.0"
description = "Queue, balance, and monitor a fleet of MinerU parse services"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mineru-queue = "mineru_queue.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
